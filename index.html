mo-pill"><i></i> Demo mode</span><button class="icon-btn" id="theme-help" aria-label="About demo mode" title="About demo mode">?</button></div></header><section id="page-content" class="content"></section><footer>Made for the next big idea <span>✦</span> <small>Your projects stay in this browser.</small></footer></main></div><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  function addPlans(){
    let saved=null;
    document.querySelectorAll('*').forEach(el=>{
      if(el.textContent.trim()==='Saved projects' || el.textContent.trim()==='Saved Projects'){
      }
    });
    let nav=saved.parentElement;
    // go up to find the bar with 4 tabs
    for(let i=0;i<6;i++){
      if(nav && nav.children.length>=4 && nav.textContent.includes('Home') && nav.textContent.includes('Create')) break;
      if(nav.parentElement) nav=nav.parentElement;
    }
    // clone Create tab to keep same look
    let createTab=null;
    nav.querySelectorAll('*').forEach(el=>{ if(el.textContent.trim()==='Create') createTab=el.closest('a')||el.closest('div')||el.parentElement; });
    let ref=createTab||saved.closest('a')||saved.closest('div')||saved;
    let clone=ref.cloneNode(true);
    clone.innerHTML = clone.innerHTML.replace('Create','Plans').replace('Home','Plans').replace(/Meme\s*maker/i,'Plans').replace('Saved projects','Plans').replace('Saved Projects','Plans');
    // set icon
    if(clone.innerHTML.includes('✴')||clone.innerHTML.includes('✳')||clone.innerHTML.includes('❋')){ }
    // force text to Plans with same style
    clone.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="font-size:18px;">◈</div><div>Plans</div></div>';
    clone.setAttribute('href','plans.html');
    clone.style.flex='1';
    clone.style.display='flex';
    clone.style.flexDirection='column';
    clone.style.alignItems='center';
    clone.style.justifyContent='center';
    clone.style.cursor='pointer';
    clone.style.textDecoration='none';
    clone.style.color='rgba(255,255,255,0.7)';
    clone.onclick=function(){ location.href='plans.html'; };
    nav.appendChild(clone);
    // make all 5 equal
    Array.from(nav.children).forEach(c=>{ c.style.flex='1'; });
  }
  addPlans();
  setTimeout(addPlans, 500);
  setTimeout(addPlans, 1500);
});
</script>
</body></html>
